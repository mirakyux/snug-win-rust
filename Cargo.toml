[workspace]
resolver = "2"
members = ["crates/snug-core", "crates/snug-win", "crates/snug-app"]

[workspace.package]
# 唯一版本来源：crate 版本 = exe 资源里的 FileVersion/ProductVersion
# = 自动更新跟 GitHub tag 比的版本。
#
# 1.2.0 → 1.3.0：对齐 C# 原版 v1.3.0 的功能面（多屏/主题/重入胶囊/预览窗/归属记录）。
# 两版的资产名不同（我们 `Snug-v…`、C# `SnugWin-v…`），同号不会互相覆盖；
# 更新源是编译期 SNUG_RELEASES_REPO，只有配了才发请求。
version = "1.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
# 不开 panic = "abort"：eframe/egui 有个别地方依赖 unwind。
