[workspace]
resolver = "2"
members = ["crates/snug-core", "crates/snug-win", "crates/snug-app"]

[workspace.package]
# 唯一版本来源：C# 版 Directory.Build.props 的 <Version>1.2.0</Version>。
# crate 版本 = exe 资源里的 FileVersion/ProductVersion = 自动更新跟 GitHub tag 比的版本。
version = "1.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
# 不开 panic = "abort"：eframe/egui 有个别地方依赖 unwind。
