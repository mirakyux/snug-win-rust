[workspace]
resolver = "2"
members = ["crates/snug-core", "crates/snug-win", "crates/snug-app"]

[workspace.package]
# 唯一版本来源：crate 版本 = exe 资源里的 FileVersion/ProductVersion
# = 自动更新跟 GitHub tag 比的版本。
#
# 1.2.0 → 1.3.0：对齐 C# 原版 v1.3.0 的功能面（多屏/主题/重入胶囊/预览窗/归属记录）。
# 两版的资产名不同（我们 `Snug-v…`、C# `SnugWin-v…`），同号不会互相覆盖；
# 更新源是编译期 SNUG_RELEASES_REPO，只有配了才发请求。
version = "1.3.0"
edition = "2024"
# 1.89 是硬下限：单实例锁用了 `File::try_lock`（1.89 稳定）。
# edition 2024 本身只要 1.85，但声明低版本而实际用高版本 API 会让别人按 1.85 装不上。
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
# 不开 panic = "abort"：eframe/egui 有个别地方依赖 unwind。
