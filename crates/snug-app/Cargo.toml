[package]
name = "snug-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SnugWin 的托盘程序与手机屏界面（Rust 版）"

[[bin]]
name = "snug"
path = "src/main.rs"

[dependencies]
eframe = "0.32.3"
image = { version = "0.25.9", default-features = false, features = ["png", "ico"] }
snug-core = { path = "../snug-core" }
snug-win = { path = "../snug-win" }
tray-icon = "0.24.2"
